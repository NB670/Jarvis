appId: com.jarvis.jnotes
productName: Jnotes
copyright: "Copyright © 2026"

asar: false

directories:
  output: dist

files:
  - "electron/**"
  - ".next/standalone/**"
  - "!**/.git/**"
  - "!**/node_modules/.cache/**"

extraResources:
  - from: "prisma/prod.db"
    to: "prod.db"

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
  minimumSystemVersion: "13.0"
  icon: electron/assets/icon.icns

dmg:
  title: "Jnotes"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
